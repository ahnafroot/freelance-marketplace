<style>
/* Layout: sticky top bar with role switcher, one centered 1120px column, panels and list rows for scanning, escrow states shown as pills. */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--surface-2:#ECEFF6;--ink:#141A2D;--muted:#586079;--line:#DADFEA;
  --accent:#2547D0;--accent-ink:#FFFFFF;--accent-soft:#E3E9FC;
  --amber:#8C5A00;--amber-soft:#FBEFD2;--good:#13734B;--good-soft:#DDF2E7;--bad:#B3261E;--bad-soft:#FBE3E0;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1220;--surface:#171B2E;--surface-2:#1F2440;--ink:#E8EAF5;--muted:#9AA1C2;--line:#2B3152;
  --accent:#7E97FF;--accent-ink:#0F1220;--accent-soft:#232C5C;
  --amber:#E6B450;--amber-soft:#3A2F12;--good:#5BD19A;--good-soft:#143427;--bad:#FF8A80;--bad-soft:#3D1A1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1220;--surface:#171B2E;--surface-2:#1F2440;--ink:#E8EAF5;--muted:#9AA1C2;--line:#2B3152;
  --accent:#7E97FF;--accent-ink:#0F1220;--accent-soft:#232C5C;
  --amber:#E6B450;--amber-soft:#3A2F12;--good:#5BD19A;--good-soft:#143427;--bad:#FF8A80;--bad-soft:#3D1A1A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.5vw,2.9rem);font-weight:800}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.08rem;font-weight:800}
h4{font-size:.92rem;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
main.wrap{padding-block:24px 56px;min-height:60vh}
.muted{color:var(--muted)}.small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:12px}
.stack-lg{display:grid;gap:24px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--surface);padding:8px;z-index:50}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font:800 1.45rem var(--f-display);letter-spacing:-.02em}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.nav{display:flex;gap:2px;overflow-x:auto;order:3;flex:1 1 100%;scrollbar-width:thin}
@media (min-width:980px){.nav{order:0;flex:1 1 auto}}
.nav-btn{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500}
.nav-btn:hover{color:var(--ink);background:var(--surface-2)}
.nav-btn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.roles{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.role-btn{background:var(--surface);border:0;padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:500;color:var(--muted)}
.role-btn+.role-btn{border-left:1px solid var(--line)}
.role-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:700 .8rem var(--f-display)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkish{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.linkish:hover{color:var(--accent)}
label{display:grid;gap:4px;font-weight:500;font-size:.92rem;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical}
.form{display:grid;gap:12px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.file input{display:none}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel>h3{margin-bottom:10px}
.page-head{display:grid;gap:6px;margin-bottom:18px}
.sub{color:var(--muted);max-width:62ch}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:880px){.split{grid-template-columns:minmax(0,1fr)}}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.empty{padding:28px 18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}

/* badges and pills */
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge,.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.76rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok,.pill.good{background:var(--good-soft);color:var(--good)}
.badge.warn,.pill.hold{background:var(--amber-soft);color:var(--amber)}
.badge.top,.pill.acc{background:var(--accent-soft);color:var(--accent)}
.badge.no{background:var(--surface-2);color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:1px 8px;font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rating{font-weight:600;white-space:nowrap}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:8px 28px}
@media (max-width:880px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin-top:12px}
.hero-search{display:flex;gap:8px;margin-top:20px;max-width:520px}
.eyebrow{font:500 .75rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:0}
.steps li{display:flex;justify-content:space-between;gap:12px;padding:10px 0 10px 24px;position:relative;border-left:2px solid var(--line);margin-left:6px}
.steps li::before{content:"";position:absolute;left:-7px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}
.steps li.now::before{background:var(--amber)}
.steps b{font-family:var(--f-mono);font-weight:500}
.ledger-foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
.probs{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.prob{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px 20px;align-items:center;padding:14px 18px}
.prob+.prob{border-top:1px solid var(--line)}
@media (max-width:760px){.prob{grid-template-columns:minmax(0,1fr)}}
.prob .p{color:var(--muted)}

/* job list */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:14px}
@media (max-width:760px){.filters{grid-template-columns:minmax(0,1fr)}}
.job{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer}
.job:hover{border-color:var(--muted)}
@media (max-width:640px){.job{grid-template-columns:minmax(0,1fr)}}
.job-main{display:grid;gap:6px;min-width:0}
.excerpt{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--muted);font-size:.85rem}
.job-side{display:grid;gap:6px;align-content:start}
.budget{font:500 1.15rem var(--f-mono)}
.budget small{font-size:.75rem;color:var(--muted)}

/* fees */
.fee-rows{margin:0;display:grid;gap:4px;font-size:.9rem}
.fee-rows div{display:flex;justify-content:space-between;gap:12px}
.fee-rows dt{color:var(--muted)}.fee-rows dd{margin:0;font-family:var(--f-mono)}
.fee-rows .total{border-top:1px solid var(--line);padding-top:4px;font-weight:600}
.fee-rows .total dt{color:var(--ink)}

/* contracts */
.k-card{display:grid;gap:8px;cursor:pointer}
.k-card:hover{border-color:var(--muted)}
.k-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.need{color:var(--amber);font-weight:600;font-size:.88rem}
.sumstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sumstrip div{background:var(--surface);padding:12px 16px;display:grid;gap:2px}
.sumstrip span{font-size:.78rem;color:var(--muted)}
.sumstrip b{font:500 1.15rem var(--f-mono)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.ms{display:grid;gap:10px}
.ms-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:start}
.ms-amt{font:500 1.2rem var(--f-mono)}
.ms-note{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.9rem;display:grid;gap:2px}
.hist{margin:0;padding:0;list-style:none;font-size:.82rem;color:var(--muted);display:grid;gap:2px}

/* messages */
.thread{display:grid;gap:10px;max-height:460px;overflow-y:auto;padding:4px}
.msg{max-width:82%;background:var(--surface-2);border-radius:10px;padding:8px 12px;display:grid;gap:2px}
.msg.mine{justify-self:end;background:var(--accent-soft)}
.msg .by{font-size:.78rem;color:var(--muted)}

/* time */
.act{display:inline-block;width:72px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;vertical-align:middle}
.act i{display:block;height:100%;background:var(--accent)}
.clock{font:500 2rem var(--f-mono)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}

/* admin */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.tile span{font-size:.8rem;color:var(--muted)}
.tile b{font:500 1.5rem var(--f-mono)}
.tile.attn b{color:var(--amber)}
.evi{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.evi section{background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0;font-size:.88rem}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1;fill:none}
.chart .rev{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .cost{stroke:var(--bad);stroke-width:2;stroke-dasharray:6 4;fill:none}
.chart .loss{fill:var(--bad-soft)}.chart .gain{fill:var(--good-soft)}
.chart .bep{fill:var(--ink)}
.chart .lbl{fill:var(--ink);font-weight:500}

.stars{display:flex;gap:6px;border:0;padding:0;margin:0}
.stars legend{font-weight:500;font-size:.92rem;margin-bottom:4px;padding:0}
.stars label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.foot{padding-block:24px 40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:min(92vw,520px);z-index:60;font-size:.92rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:700px){.who-name{display:none}}
</style>

function feePreview(bid,type){

}
function isFinal(m){return m.status==='released'||m.status==='refunded'||m.status==='split';}
function paidOut(m){return m.status==='released'?m.amount:m.status==='split'?m.amount/2:0;}
function escrowOf(k){return k.milestones.filter(function(m){return ['funded','submitted','revision','disputed'].indexOf(m.status)>-1;}).reduce(function(s,m){return s+m.amount;},0);}
function unpaidMin(k){return (k.time||[]).filter(function(e){return !e.paid;}).reduce(function(s,e){return s+e.minutes;},0);}
function paidMin(k){return (k.time||[]).filter(function(e){return e.paid;}).reduce(function(s,e){return s+e.minutes;},0);}
function grossPaid(k){return k.type==='hourly'?paidMin(k)/60*k.rate:k.milestones.reduce(function(s,m){return s+paidOut(m);},0);}
function weekMin(k){var c=Date.now()-7*DAY;return (k.time||[]).filter(function(e){return e.t>=c;}).reduce(function(s,e){return s+e.minutes;},0);}
function checkComplete(k){
  if(k.type==='fixed'&&k.milestones.length&&k.milestones.every(isFinal)&&k.status!=='completed'){k.status='completed';log('system','Contract "'+k.title+'" completed',k.id);}
}

function needOf(k){
  var r=S.role;
  if(r==='admin')return k.status==='disputed'?'Dispute open':'';
  if(r==='client'){
    if(k.milestones.some(function(m){return m.status==='submitted';}))return 'Work waiting for your review';
    if(k.milestones.some(function(m){return m.status==='proposed'&&m.by==='freelancer';}))return 'Scope change to approve';
    if(k.milestones.some(function(m){return m.status==='unfunded';})&&k.status==='active')return 'A milestone needs funding';
    if(k.type==='hourly'&&unpaidMin(k)>0)return 'Hours waiting for approval';
  }else{
    if(k.milestones.some(function(m){return m.status==='funded'||m.status==='revision';}))return 'Funded and ready for you to submit';
    if(k.milestones.some(function(m){return m.status==='proposed'&&m.by==='client';}))return 'Scope change to approve';
  }
  return '';
}

/* ---------- earnings and break-even ---------- */
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p,m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return m*p;}
function planCalc(){
  var P=S.plan,fixed=0,k;for(k in P.c)fixed+=+P.c[k]||0;
  var netHr=P.rate*(1-P.fee/100),bep=netHr>0?fixed/netHr:null;
  return {fixed:fixed,netHr:netHr,bep:bep};
}
function chartSVG(r){
  var W=640,H=300,ml=58,mr=16,mt=14,mb=40;
  if(!(r.netHr>0))return '<p class="muted">Net hourly income must be above zero to draw the chart.</p>';
  var X=niceMax(Math.max(200,(r.bep||0)*2)),v=Math.max(r.fixed*1.5,X*r.netHr),ys=niceMax(v/5),Y=Math.ceil(v/ys)*ys,xs=niceMax(X/8);
  function sx(x){return ml+x/X*(W-ml-mr);}function sy(y){return mt+(1-y/Y)*(H-mt-mb);}
  var g='',i;
  for(i=0;i<=Y+1e-6;i+=ys)g+='<line class="grid" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+sy(i)+'" y2="'+sy(i)+'"/><text x="'+(ml-8)+'" y="'+(sy(i)+4)+'" text-anchor="end">'+i.toLocaleString('en-US')+'</text>';
  for(i=0;i<=X+1e-6;i+=xs)g+='<line class="grid" x1="'+sx(i)+'" x2="'+sx(i)+'" y1="'+mt+'" y2="'+(H-mb)+'"/><text x="'+sx(i)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+i+'</text>';
  var b=r.bep,fy=sy(r.fixed);
  var loss='<polygon class="loss" points="'+sx(0)+','+fy+' '+sx(b)+','+fy+' '+sx(0)+','+sy(0)+'"/>';
  var gain='<polygon class="gain" points="'+sx(b)+','+fy+' '+sx(X)+','+fy+' '+sx(X)+','+sy(X*r.netHr)+'"/>';
  var anchor=sx(b)>W*0.65?'end':'start',lx=sx(b)+(anchor==='end'?-10:10);
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Break-even chart: net revenue crosses fixed costs at '+b.toFixed(1)+' billable hours">'+g+loss+gain+
   '<line class="cost" x1="'+sx(0)+'" x2="'+sx(X)+'" y1="'+fy+'" y2="'+fy+'"/><line class="rev" x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(X)+'" y2="'+sy(X*r.netHr)+'"/>'+
   '<circle class="bep" cx="'+sx(b)+'" cy="'+fy+'" r="5"/><text class="lbl" x="'+lx+'" y="'+(fy-12)+'" text-anchor="'+anchor+'">Break-even '+b.toFixed(1)+' h</text>'+
   '<text x="'+((ml+W-mr)/2)+'" y="'+(H-4)+'" text-anchor="middle">Annual billable hours</text><text x="12" y="'+(mt+8)+'">USD</text></svg>';
}

};
FORM['submit-work']=function(fd,f,d){
  var x=ctx(d),file=fd.get('file'),name=file&&file.name?file.name:'deliverable.zip',v=x.m.files.length+1;
  x.m.files.push({file:name,note:String(fd.get('note')),t:Date.now(),version:v});x.m.status='submitted';mh(x.m,'Work submitted (v'+v+')');
  log('freelancer','Submitted "'+x.m.title+'" (v'+v+')',x.k.id);S.openForm=null;toast('Submitted. The client has 14 days to review.');render();
};
FORM.revision=function(fd,f,d){var x=ctx(d);x.m.status='revision';mh(x.m,'Revision requested: '+fd.get('text'));log('client','Requested a revision on "'+x.m.title+'"',x.k.id);S.openForm=null;toast('Revision requested.');render();};
FORM.dispute=function(fd,f,d){
  var x=ctx(d);x.m.status='disputed';x.k.status='disputed';mh(x.m,'Dispute opened by '+S.role);
  D.disputes.push({id:uid('d'),kid:x.k.id,mid:x.m.id,openedBy:S.role,reason:String(fd.get('text')),t:Date.now(),status:'open'});
  log(S.role,'Dispute opened on "'+x.m.title+'"',x.k.id);S.openForm=null;toast('Dispute opened. Escrow is frozen until an admin decides.');render();
};
FORM.scope=function(fd,f,d){
  var k=byId(D.contracts,d.kid);k.milestones.push({id:uid('m'),title:String(fd.get('title')),amount:+fd.get('amount'),status:'proposed',by:S.role,files:[],history:[{t:Date.now(),text:'Proposed by '+S.role}]});
  log(S.role,'Proposed new milestone "'+fd.get('title')+'" ('+money(+fd.get('amount'))+')',k.id);S.openForm=null;toast('Sent to the other side for approval.');render();
};
FORM['send-msg']=function(fd,f,d){
  var file=fd.get('file');(D.msgs[d.kid]=D.msgs[d.kid]||[]).push({id:uid('g'),from:S.role,text:String(fd.get('text')),files:file&&file.name?[file.name]:[],t:Date.now()});
  log(S.role,'Message sent'+(file&&file.name?' with file '+file.name:''),d.kid);render();
};
FORM.review=function(fd,f,d){
  var k=byId(D.contracts,d.kid),role=S.role,to=U[role==='client'?k.freelancer:k.client],stars=+fd.get('stars');
  D.reviews.push({id:uid('rv'),kid:k.id,fromRole:role,author:role==='client'?U[k.client].company:U[k.freelancer].name,to:to.id,stars:stars,text:String(fd.get('text')),t:Date.now()});
  to.rating=to.jobs?(to.rating*to.jobs+stars)/(to.jobs+1):stars;to.jobs+=1;log(role,'Review posted for '+to.name,k.id);toast('Review posted.');render();
};
FORM.resolve=function(fd,f,d,sub){
  var ds=byId(D.disputes,d.id),k=byId(D.contracts,ds.kid),m=byId(k.milestones,ds.mid),o=sub&&sub.value||'release';
  m.status=o==='release'?'released':o==='refund'?'refunded':'split';ds.status='resolved';
  ds.outcome=o==='release'?'Released to freelancer':o==='refund'?'Refunded to client':'Split 50/50';ds.note=String(fd.get('note'));
  mh(m,'Admin decision: '+ds.outcome);k.status='active';checkComplete(k);
  log('admin','Dispute on "'+m.title+'" resolved: '+ds.outcome,k.id);toast('Dispute resolved: '+ds.outcome+'.');render();
};

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el);}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();var fn=FORM[f.dataset.form];if(fn)fn(new FormData(f),f,f.dataset,e.submitter);
});
document.addEventListener('input',function(e){
  var el=e.target.closest('[data-input]');if(!el)return;
  var k=el.dataset.input;
  if(k==='q'){S.q=el.value;renderJobList();}
  else if(k==='cat'){S.cat=el.value;renderJobList();}
  else if(k==='type'){S.type=el.value;renderJobList();}
  else if(k==='ver'){S.ver=el.checked;renderJobList();}
  else if(k==='bidpreview'){var p=$('#feeprev');if(p)p.innerHTML=feePreview(el.value,el.dataset.type);}
  else if(k==='fname'){var s=el.closest('label').querySelector('span');if(s)s.textContent=el.files[0]?el.files[0].name:'Attach file';}
  else if(k==='plan'){
    var n=el.name,v=+el.value;
    if(n==='rate')S.plan.rate=v;else if(n==='fee')S.plan.fee=v;else S.plan.c[n.slice(2)]=v;
    renderPlanner();
  }
});
render();
})();
</script>

</body></html>
